<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Passwords</title>
    <style>
      :root {
        --bg: #f3f1ec;
        --panel: #ffffff;
        --text: #1b1d20;
        --muted: #6d7278;
        --border: rgba(27, 29, 32, 0.08);
        --accent-2: #1f2329;
        --danger: #fbefef;
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        width: 380px;
        color: var(--text);
        background: var(--bg);
        font-family: var(--sans);
      }
      .card {
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--panel);
        padding: 14px;
        box-shadow: 0 12px 32px rgba(17, 24, 39, 0.08);
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        border: 1px solid var(--border);
        background: #f5f4f0;
        color: var(--text);
        padding: 9px 11px;
        border-radius: 12px;
        cursor: pointer;
      }
      button:not(.primary):not(.danger):hover {
        background: #eceae4;
      }
      button.primary {
        border-color: #1f2329;
        background: var(--accent-2);
        color: #ffffff;
      }
      button.danger {
        border-color: rgba(177, 93, 93, 0.14);
        background: var(--danger);
        color: #8c4e4e;
      }
      input[type="text"],
      input[type="password"],
      select {
        width: 100%;
        padding: 9px 11px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: #fbfaf7;
        color: var(--text);
      }
      input::placeholder {
        color: #9aa0a6;
      }
      .muted {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
      }
      .status {
        margin-top: 10px;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .list {
        display: grid;
        gap: 8px;
        margin-top: 10px;
      }
      .item {
        border: 1px solid rgba(27, 29, 32, 0.08);
        border-radius: 14px;
        padding: 10px;
        background: #faf9f6;
      }
      .item-actions {
        margin-top: 8px;
      }
      .item .svc {
        font-weight: 650;
        font-size: 13px;
      }
      .item .url {
        color: var(--muted);
        font-size: 11px;
        word-break: break-word;
        margin-top: 2px;
      }
      .badge {
        display: inline-block;
        border: 1px solid rgba(27, 29, 32, 0.08);
        border-radius: 999px;
        padding: 3px 8px;
        font-size: 11px;
        color: var(--muted);
        background: #ffffff;
      }
      .hr {
        height: 1px;
        background: rgba(27, 29, 32, 0.08);
        margin: 10px 0;
      }
      .hidden {
        display: none;
      }
      .totp-panel {
        margin-top: 8px;
        padding: 10px;
        border-radius: 12px;
        border: 1px solid rgba(27, 29, 32, 0.08);
        background: #ffffff;
      }
      .totp-code {
        font-family: var(--mono);
        font-size: 24px;
        letter-spacing: 0.18em;
        font-weight: 700;
      }
      .totp-meta {
        color: var(--muted);
        font-size: 11px;
        margin-top: 4px;
      }
      .totp-error {
        color: #a45a5a;
      }
      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
      }
      .ghost-link {
        text-decoration: none;
        color: var(--muted);
        font-size: 12px;
        padding: 4px 0;
      }
      .section-title {
        font-size: 12px;
        color: var(--muted);
        font-weight: 650;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="topline">
        <div id="domain-indicator" class="muted"></div>
        <a href="options.html" target="_blank" class="ghost-link">Settings</a>
      </div>

      <div id="view-disconnected">
        <div class="section-title">Connect</div>
        <div style="height: 8px"></div>
        <div class="row">
          <button id="btn-connect" class="primary">Connect</button>
        </div>
        <div class="muted" style="margin-top: 8px">Use this page or Settings to open the device. Background pages cannot use WebSerial.</div>
      </div>

      <div id="view-locked" class="hidden">
        <div class="section-title">Unlock</div>
        <div style="height: 8px"></div>
        <div class="row">
          <input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN (4–8 digits)" />
          <button id="btn-unlock" class="primary">Unlock</button>
          <button id="btn-disconnect">Disconnect</button>
        </div>
        <div class="muted" style="margin-top: 8px">On a new device, the first successful unlock sets the PIN.</div>
      </div>

      <div id="view-unlocked" class="hidden">
        <div class="section-title">Saved</div>
        <div style="height: 8px"></div>
        <div class="row">
          <input id="search" type="text" placeholder="Search" />
          <button id="btn-refresh">Refresh</button>
        </div>
        <div class="row" style="margin-top: 8px">
          <button id="btn-lock" class="danger">Lock</button>
          <button id="btn-clear-captured">Clear Prompt</button>
          <button id="btn-show-add">Add</button>
        </div>

        <div id="add-box" class="hidden">
          <div class="hr"></div>
          <div class="section-title">Add</div>
          <div style="height: 6px"></div>
          <div class="row" style="width: 100%">
            <input id="add-service" type="text" placeholder="Service" />
          </div>
          <div style="height: 6px"></div>
          <div class="row" style="width: 100%">
            <input id="add-url" type="text" placeholder="URL or domain" />
          </div>
          <div style="height: 6px"></div>
          <div class="row" style="width: 100%">
            <input id="add-username" type="text" placeholder="Username" />
          </div>
          <div style="height: 6px"></div>
          <div class="row" style="width: 100%">
            <input id="add-password" type="password" placeholder="Password" />
          </div>
          <div style="height: 6px"></div>
          <div style="width: 100%">
            <label style="font-size: 11px; color: var(--muted); display: block; margin-bottom: 4px">TOTP Secret (optional)</label>
            <input id="add-totp" type="text" placeholder="BASE32SECRET" />
          </div>
          <div style="height: 6px"></div>
          <div class="row" style="width: 100%">
            <select id="add-hid-mode">
              <option value="0">Password only</option>
              <option value="1" selected>Username + TAB + Password</option>
              <option value="2">Username + TAB + Password + ENTER</option>
            </select>
          </div>
          <div style="height: 8px"></div>
          <div class="row">
            <button id="btn-add-save" class="primary">Save</button>
            <button id="btn-add-cancel">Cancel</button>
          </div>
        </div>

        <div id="save-box" class="hidden">
          <div class="hr"></div>
          <div class="section-title">Save Prompt</div>
          <div style="height: 6px"></div>
          <div class="row" style="width: 100%">
            <input id="save-service" type="text" placeholder="Service" />
          </div>
          <div style="height: 6px"></div>
          <div class="row" style="width: 100%">
            <input id="save-url" type="text" placeholder="URL / domain" />
          </div>
          <div style="height: 6px"></div>
          <div class="row" style="width: 100%">
            <input id="save-username" type="text" placeholder="Username" />
          </div>
          <div style="height: 6px"></div>
          <div class="row" style="width: 100%">
            <input id="save-password" type="password" placeholder="Password" />
          </div>
          <div style="height: 6px"></div>
          <div class="row" style="width: 100%">
            <select id="save-hid-mode">
              <option value="0">Password only</option>
              <option value="1" selected>Username + TAB + Password</option>
              <option value="2">Username + TAB + Password + ENTER</option>
            </select>
          </div>
          <div style="height: 8px"></div>
          <div class="row">
            <button id="btn-save" class="primary">Save</button>
          </div>
        </div>

        <div class="hr"></div>
        <div class="muted">Select sends the entry to the device. TOTP shows a live 6-digit code when a secret is stored.</div>
        <div id="list" class="list"></div>
      </div>

      <div id="status" class="status"></div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
